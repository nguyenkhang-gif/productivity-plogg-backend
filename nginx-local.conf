# Nginx test local — Load Balancer cho 2 instance chạy trên máy (PORT=3001, PORT=3002)
# Dùng cho Phase 3 trong docs/implement/redis-adapter-guide.md
#
# Chạy:
#   docker run --rm -d --name nginx-local -p 8090:80 \
#     --add-host=host.docker.internal:host-gateway \
#     -v "$(pwd)/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine

upstream plog_backend {
    # Test local: 1000 socket đều xuất phát từ CÙNG 1 máy/IP thật, nên
    # ip_hash (hash theo IP TCP thật) sẽ luôn chọn ra đúng 1 backend, không
    # chia tải được. Để giả lập "1000 IP khác nhau", hash theo header
    # X-Forwarded-For do chính test script tự gắn (mỗi socket 1 giá trị giả
    # khác nhau) thay vì theo IP thật.
    #
    # Ở production thật, sticky phải dùng ip_hash (client IP thật) hoặc
    # cookie — dùng X-Forwarded-For tự gắn như thế này chỉ hợp lệ khi TỰ
    # KIỂM SOÁT được client (test script), không dùng cho traffic công khai.
    # Round-robin mặc định (bỏ hash) — mỗi socket.io connection dùng
    # transports:['websocket'] là 1 request upgrade duy nhất, nên round-robin
    # luân phiên từng connection sang 2 backend → chia đều ~500/500.
    # (hash $http_x_forwarded_for không chia đều với ít node → đã bỏ.)
    #
    # max_fails=0: TẮT passive health-check. Khi 1000 WS upgrade ập vào cùng
    # lúc, vài connection "premature close" sẽ khiến nginx (mặc định max_fails=1)
    # mark backend down → cascade "no live upstreams" → toàn bộ fail. Tắt đi để
    # nginx không bao giờ loại backend vì lỗi connection lẻ (hợp lý cho load test).
    # Liệt kê tối đa 4 backend. Chạy profile "quad" (cả 4 instance 3001-3004)
    # để khớp. Nếu test ít instance hơn, comment bớt dòng tương ứng để nginx
    # không route vào backend không chạy.
    server host.docker.internal:3001 max_fails=0;
    server host.docker.internal:3002 max_fails=0;
    # 2-instance test: comment 3003/3004. Test 4 instance thì bỏ comment lại.
    # server host.docker.internal:3003 max_fails=0;
    # server host.docker.internal:3004 max_fails=0;
}

server {
    listen 80;

    location / {
        proxy_pass http://plog_backend;

        # Bắt buộc cho WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket cần timeout dài hơn HTTP thường
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
