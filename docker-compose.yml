version: '3.8'

services:
  api:
    build:
      context: .
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - WHISPER_PATH=/opt/whisper.cpp/build/bin/whisper-cli
      - MODEL_PATH=/opt/whisper.cpp/models/ggml-base.bin
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --config /home/nonroot/.cloudflared/config.yml run plog-backend
    volumes:
      - ./.cloudflared:/home/nonroot/.cloudflared
    depends_on:
      api:
        condition: service_healthy
    restart: always