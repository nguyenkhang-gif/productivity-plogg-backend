services:
  - type: web
    name: plog-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # --- Auth ---
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRATION_TIME
        sync: false

      # --- Database ---
      - key: MONGO_DB_URI
        sync: false

      # --- Redis ---
      - key: REDIS_URL
        sync: false

      # --- Mail ---
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false

      # --- Cloudinary ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Gemini ---
      - key: GEMINI_API_KEY
        sync: false

      # --- CORS / Frontend ---
      - key: CLIENT_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      # --- Google OAuth (login) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      # --- Facebook OAuth (login) ---
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false

      # --- Google Drive ---
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
