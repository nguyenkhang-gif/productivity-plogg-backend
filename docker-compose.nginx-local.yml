# Nginx Load Balancer — CHỈ DÙNG để test local Phase 3 (redis-adapter-guide.md).
# Route vào 2 instance Node chạy NATIVE trên host (PORT=3001 / PORT=3002),
# không phải 2 container — nên cần host.docker.internal để gọi ra host.
#
# Chạy (sau khi đã có 2 instance đang chạy: PORT=3001 và PORT=3002 npm run start:dev):
#   docker compose -f docker-compose.nginx-local.yml up -d
#
# Dừng:
#   docker compose -f docker-compose.nginx-local.yml down
#
# Xem log / debug:
#   docker compose -f docker-compose.nginx-local.yml logs -f
#   docker compose -f docker-compose.nginx-local.yml exec nginx nginx -t

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-local
    ports:
      - "8090:80"
    volumes:
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
