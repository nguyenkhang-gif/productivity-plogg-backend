# Main nginx.conf tùy chỉnh cho load test — nâng worker_connections.
# Mặc định của nginx là 1024, KHÔNG đủ khi proxy 1000+ WebSocket (mỗi conn
# tốn 2 slot: 1 phía client + 1 phía upstream → cần ~2000+). Đây là giới hạn
# THẬT cần chỉnh khi LB nhiều connection, không phải giới hạn số instance.
worker_processes auto;

events {
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # nạp server/upstream config từ conf.d (nginx-local.conf mount vào đây)
    include /etc/nginx/conf.d/*.conf;
}
